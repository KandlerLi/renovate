name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RENOVATE_VERSION: 44.190.2

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict config.js
