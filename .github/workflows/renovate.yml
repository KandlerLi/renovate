name: Renovate

on:
  # Hourly, since GitHub delays or drops scheduled runs; config.js' time windows decide when PRs happen.
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level (debug shows e.g. GraphQL errors)
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate

permissions: {}

env:
  RENOVATE_VERSION: 44.190.2

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    # The apply role's OIDC trust requires it.
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Read App credentials
        id: app
        run: |
          secret="$(aws secretsmanager get-secret-value --region eu-central-1 --secret-id renovate/github-app --query SecretString --output text)"
          key="$(jq -r .app_private_key <<<"$secret")"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<<"$key"
          echo "client_id=$(jq -r .client_id <<<"$secret")" >> "$GITHUB_OUTPUT"
          {
            echo "private_key<<PEM_END"
            echo "$key"
            echo "PEM_END"
          } >> "$GITHUB_OUTPUT"

      - name: Mint App token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.app.outputs.client_id }}
          private-key: ${{ steps.app.outputs.private_key }}
          owner: KandlerLi

      # Own images are private: config.js' ghcr.io/kandlerli rule needs registry access.
      - name: Read GHCR pull token
        id: ghcr
        run: |
          token="$(aws secretsmanager get-secret-value --region eu-central-1 --secret-id k3s-apps/ghcr-pull-token --query SecretString --output text | jq -r .token)"
          echo "::add-mask::$token"
          echo "host_rules=$(jq -cn --arg t "$token" '[{matchHost: "ghcr.io", username: "KandlerLi", password: $t}]')" >> "$GITHUB_OUTPUT"

      - uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          configurationFile: config.js
          token: ${{ steps.token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_HOST_RULES: ${{ steps.ghcr.outputs.host_rules }}
